apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.env
  version: v1
  # Only the crawler processes may read secrets. Set the referenced
  # environment variables (REDIS_PASSWORD, REDIS_ENABLE_TLS) before running:
  # the component fails to load if a referenced key is missing.
  scopes:
  - telegram-scraper
  - distributed-scheduler
