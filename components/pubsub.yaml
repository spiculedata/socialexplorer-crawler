apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  # Redis credentials come from the environment through the local env secret
  # store (components/secretstore.yaml), never from this file. Set
  # REDIS_PASSWORD before running; set REDIS_ENABLE_TLS to "true" for a TLS
  # endpoint.
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    secretKeyRef:
      name: REDIS_PASSWORD
      key: REDIS_PASSWORD
  - name: enableTLS
    secretKeyRef:
      name: REDIS_ENABLE_TLS
      key: REDIS_ENABLE_TLS
  # Only the crawler's own app IDs may use this component.
  scopes:
  - telegram-scraper
  - distributed-scheduler
  # Only the topics the distributed crawler actually uses (see
  # distributed/messages.go and config/distributed.go).
  allowedTopics:
  - crawl-work-queue
  - crawl-results
  - worker-status
  - orchestrator-commands
