name: Go
on:
  push:
    branches:
      - feature/**
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: install tdlib
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli cmake g++ ninja-build
          git clone https://github.com/tdlib/td.git td
          cd td
          git checkout 971684a3dcc7bdf99eec024e1c4f57ae729d6d53
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja ..
          sudo cmake --build . --target install
          sudo ldconfig
          echo "Installed TDLib files:"
          ls -la /usr/local/lib/ | grep -E "(td|TD)" || echo "No TDLib libraries found"
          ls -la /usr/local/include/ | grep -E "(td|TD)" || echo "No TDLib headers found"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Track the Go version declared by go.mod instead of a hard-coded one.
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: |
          export CGO_CFLAGS="-I/usr/local/include"
          export CGO_LDFLAGS="-L/usr/local/lib -ltdjson"
          go build -v ./...
      - name: Test with the Go CLI
        run: |
          export CGO_CFLAGS="-I/usr/local/include"
          export CGO_LDFLAGS="-L/usr/local/lib -ltdjson"
          go test ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          export CGO_CFLAGS="-I/usr/local/include"
          export CGO_LDFLAGS="-L/usr/local/lib -ltdjson"
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
