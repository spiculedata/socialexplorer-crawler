name: Secret scan

on:
  push:
    branches:
      - main
      - dev
      - feature/**
      - release/**
  pull_request:
  schedule:
    # Weekly full-history rescan, Monday 03:20 UTC.
    - cron: '20 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan working tree and full git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just the tip.
          fetch-depth: 0

      - name: Scan the full git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Never print the matched secret in logs or annotations.
          redact: true
          # The action exits non-zero when a secret is found, failing the job.
          # Findings are expected to persist until the leaked key is removed
          # from history (history rewrite is a maintainer action); the red job
          # is the visible reminder that the rewrite has not happened yet.
