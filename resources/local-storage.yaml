apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: telegramcrawlstorage
spec:
  type: bindings.localstorage
  version: v1
  metadata:
  - name: rootPath
    value: "/tmp/dapr/crawls"
  # Only the crawler's own app IDs may use this binding.
  scopes:
  - telegram-scraper
  - distributed-scheduler
